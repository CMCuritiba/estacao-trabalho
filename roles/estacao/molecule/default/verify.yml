---
# Molecule verify playbook for Estação de Trabalho CMC
# Este arquivo automatiza os testes que podem ser validados programaticamente

- name: Verify
  hosts: all
  gather_facts: true
  become: true

  vars:
    estacao_suporte_user: "suporte"
    estacao_bootsh: "/usr/local/cmc/scripts/cmc-boot.sh"
    estacao_chrome_policy: "/etc/opt/chrome/policies/managed/cmc.json"

  tasks:
    # Categoria: Usuários e Grupos (010-user-group-suporte.yml)
    - name: "Test 001-002: Verify support user exists and is in correct groups"
      block:
        - name: Get support user info
          ansible.builtin.getent:
            database: passwd
            key: "{{ estacao_suporte_user }}"
          register: estacao_user

        - name: Verify support user exists
          ansible.builtin.assert:
            that: "estacao_suporte_user in estacao_user.ansible_facts.getent_passwd"
            fail_msg: "Support user {{ estacao_suporte_user }} does not exist"
            success_msg: "Support user {{ estacao_suporte_user }} exists"

        - name: Get support user groups
          ansible.builtin.command: "id {{ estacao_suporte_user }}"
          register: estacao_groups
          changed_when: false

        - name: Verify support user is in sudo group
          ansible.builtin.assert:
            that: "'sudo' in estacao_groups.stdout"
            fail_msg: "Support user is not in sudo group"
            success_msg: "Support user is in sudo group"

    # Test 003: Root password test (can't be automated safely)

    - name: Check installed packages
      ansible.builtin.package_facts:
        manager: "auto"

    # Categoria: Remoção de Programas (020-remover-programas.yml)
    - name: "Test 004: Verify unwanted programs are removed"
      ansible.builtin.assert:
        that: "item not in ansible_facts.packages"
        fail_msg: "Unwanted package {{ item }} is still installed"
        success_msg: "Unwanted package {{ item }} is not installed"
      loop:
        - hexchat
        - thunderbird
        - hypnotix
        - drawing
        - celluloid
        - pix
        - webapp-manager
        - warpinator
        - sticky
        - simple-scan
        - transmission

    # Categoria: Instalação de Programas (030-instala-programas.yml)
    - name: "Test 005: Verify Brazilian repositories are configured"
      block:
        - name: Check Ubuntu repository configuration
          ansible.builtin.shell: "grep 'br.archive.ubuntu.com' /etc/apt/sources.list.d/official-package-repositories.list || true"
          register: estacao_ubuntu_repo
          changed_when: false

        - name: Check Linux Mint repository configuration
          ansible.builtin.shell: "grep 'mint-packages.c3sl.ufpr.br' /etc/apt/sources.list.d/official-package-repositories.list || true"
          register: estacao_mint_repo
          changed_when: false

        - name: Verify Brazilian repositories
          ansible.builtin.assert:
            that:
              - "estacao_ubuntu_repo.stdout != ''"
              - "estacao_mint_repo.stdout != ''"
            fail_msg: "Brazilian repositories not properly configured"
            success_msg: "Brazilian repositories properly configured"

    - name: "Test 006: Verify essential programs are installed"
      ansible.builtin.assert:
        that: "item in ansible_facts.packages"
        fail_msg: "Essential package {{ item }} is not installed"
        success_msg: "Essential package {{ item }} is installed"
      loop:
        - curl
        - vim
        # - htop
        # - tree
        - unzip
        - wget
        - openssh-client

    - name: "Test 007: Verify Google Chrome is installed"
      ansible.builtin.assert:
        that: "'google-chrome-stable' in ansible_facts.packages"
        fail_msg: "Google Chrome is not installed"
        success_msg: "Google Chrome is installed"

    # Test 008: Zoom installation (path may vary)

    # Categoria: Imagens CMC (040-imagens-cmc.yml)
    - name: "Test 009: Verify CMC background images exist"
      block:
        - name: Check CMC backgrounds directory
          ansible.builtin.stat:
            path: /usr/share/backgrounds/cmc/
          register: estacao_backgrounds

        - name: Verify backgrounds directory exists
          ansible.builtin.assert:
            that: "estacao_backgrounds.stat.exists and estacao_backgrounds.stat.isdir"
            fail_msg: "CMC backgrounds directory does not exist"
            success_msg: "CMC backgrounds directory exists"

    # Categoria: Configuração Skel (050-skel.yml)
    - name: "Test 011: Verify skel directories are created"
      block:
        - name: Check skel Desktop directory
          ansible.builtin.stat:
            path: /etc/skel/Desktop
          register: estacao_skel

        - name: Verify skel Desktop exists
          ansible.builtin.assert:
            that: "estacao_skel.stat.exists and estacao_skel.stat.isdir"
            fail_msg: "Skel Desktop directory does not exist"
            success_msg: "Skel Desktop directory exists"

    # Categoria: Browsers (060-configura-browsers.yml)
    - name: "Test 013: Verify Chrome policies file exists"
      block:
        - name: Check Chrome policies file
          ansible.builtin.stat:
            path: "{{ estacao_chrome_policy }}"
          register: estacao_chrome_policies

        - name: Verify Chrome policies exist
          ansible.builtin.assert:
            that: "estacao_chrome_policies.stat.exists"
            fail_msg: "Chrome policies file does not exist"
            success_msg: "Chrome policies file exists"

        - name: Verify Chrome policies content
          ansible.builtin.command:
            argv:
              - jq
              - .ManagedBookmarks
              - "{{ estacao_chrome_policy }}"
          register: estacao_bookmarks
          changed_when: false
          failed_when: false

        - name: Verify managed bookmarks exist
          ansible.builtin.assert:
            that: "'CMC' in estacao_bookmarks.stdout or 'Câmara' in estacao_bookmarks.stdout"
            fail_msg: "CMC bookmarks not found in Chrome policies"
            success_msg: "CMC bookmarks found in Chrome policies"
          when: estacao_bookmarks.rc == 0

    # Categoria: TTY (090-desabilita-tty.yml)
    - name: "Test 019: Verify TTY services are disabled"
      block:
        - name: Check XORG
          ansible.builtin.command:
            argv:
              - grep
              - '"DontVTSwitch" "true"'
              - /etc/X11/xorg.conf
          register: estacao_tty
          changed_when: false
          failed_when: false

        - name: Verify TTY configuration
          ansible.builtin.assert:
            that: "estacao_tty.stdout != ''"
            fail_msg: "TTY configuration not found in xorg.conf"
            success_msg: "TTY configuration found in xorg.conf"

    # Categoria: Terminal Policy (110-terminal-policy.yml)
    - name: "Test 022: Verify PolicyKit terminal configuration"
      block:
        - name: Check PolicyKit terminal file
          ansible.builtin.stat:
            path: /usr/share/polkit-1/actions/org.freedesktop.policykit.terminal.policy
          register: estacao_terminal_policy

        - name: Verify terminal policy exists
          ansible.builtin.assert:
            that: "estacao_terminal_policy.stat.exists"
            fail_msg: "Terminal PolicyKit file does not exist"
            success_msg: "Terminal PolicyKit file exists"

    # Categoria: DNS (120-configura-dns.yml)
    - name: "Test 023: Verify DNS configuration"
      block:
        - name: Check systemd-resolved configuration
          ansible.builtin.command:
            argv:
              - grep
              - -E
              - '^(DNS|Domains|FallbackDNS)='
              - /etc/systemd/resolved.conf
          register: estacao_dns
          changed_when: false
          failed_when: false

        - name: Verify DNS configuration exists
          ansible.builtin.assert:
            that: "estacao_dns.stdout != ''"
            fail_msg: "DNS configuration not found in resolved.conf"
            success_msg: "DNS configuration found in resolved.conf"

    # Categoria: Script Boot (130-script-boot.yml)
    - name: "Test 025-026: Verify boot script and service"
      block:
        - name: Check boot script exists
          ansible.builtin.stat:
            path: "{{ estacao_bootsh }}"
          register: estacao_boot_script

        - name: Verify boot script exists
          ansible.builtin.assert:
            that: "estacao_boot_script.stat.exists and estacao_boot_script.stat.executable"
            fail_msg: "Boot script does not exist or is not executable"
            success_msg: "Boot script exists and is executable"

        - name: Check boot service
          ansible.builtin.systemd:
            name: cmc-boot.service
          register: estacao_boot_service

        - name: Verify boot service is enabled
          ansible.builtin.assert:
            that: "estacao_boot_service.status.UnitFileState == 'enabled'"
            fail_msg: "Boot service is not enabled"
            success_msg: "Boot service is enabled"

    # Categoria: Integração AD (140-integra-ad.yml)
    - name: "Test 028: Verify AD packages are installed"
      block:
        - name: Verify SSSD is installed
          ansible.builtin.assert:
            that: "'sssd' in ansible_facts.packages"
            fail_msg: "SSSD package is not installed"
            success_msg: "SSSD package is installed"

        - name: Verify realm is installed
          ansible.builtin.assert:
            that: "'realmd' in ansible_facts.packages"
            fail_msg: "Realm package is not installed"
            success_msg: "Realm package is installed"

    - name: "Test 029: Verify SSSD configuration exists"
      block:
        - name: Check SSSD configuration file
          ansible.builtin.stat:
            path: /etc/sssd/sssd.conf
          register: estacao_sssd

        - name: Verify SSSD config exists
          ansible.builtin.assert:
            that: "estacao_sssd.stat.exists"
            fail_msg: "SSSD configuration file does not exist"
            success_msg: "SSSD configuration file exists"

    # Categoria: Sudoers (160-sudoers.yml)
    - name: "Test 034: Verify DTIC sudoers configuration"
      block:
        - name: Check DTIC sudoers file
          ansible.builtin.stat:
            path: /etc/sudoers.d/cmc
          register: estacao_sudoers

        - name: Verify DTIC sudoers exists
          ansible.builtin.assert:
            that: "estacao_sudoers.stat.exists"
            fail_msg: "DTIC sudoers file does not exist"
            success_msg: "DTIC sudoers file exists"

    # Categoria: Unattended Upgrades (170-unattended-upgrades.yml)
    - name: "Test 036: Verify unattended-upgrades is installed"
      ansible.builtin.assert:
        that: "'unattended-upgrades' in ansible_facts.packages"
        fail_msg: "Unattended-upgrades package is not installed"
        success_msg: "Unattended-upgrades package is installed"

    # Categoria: S3FS Mount (190-s3fs-mount.yml)
    - name: "Test 040-041: Verify S3FS installation and mount point"
      block:
        - name: Verify s3fs is installed
          ansible.builtin.assert:
            that: "'s3fs' in ansible_facts.packages"
            fail_msg: "S3FS is not installed"
            success_msg: "S3FS is installed"

        - name: Check mount point
          ansible.builtin.stat:
            path: "{{ estacao_mnt_suporte | default('/mnt/suporte') }}"
          register: estacao_mount

        - name: Verify mount point exists
          ansible.builtin.assert:
            that: "estacao_mount.stat.exists and estacao_mount.stat.isdir"
            fail_msg: "Mount point directory does not exist"
            success_msg: "Mount point directory exists"

    # Categoria: SSH Server (210-ssh-server.yml)
    - name: "Test 045-046: Verify SSH server installation and service"
      block:
        - name: Verify SSH server installed
          ansible.builtin.assert:
            that: "'openssh-server' in ansible_facts.packages"
            fail_msg: "OpenSSH server is not installed"
            success_msg: "OpenSSH server is installed"

        - name: Check SSH service status
          ansible.builtin.systemd:
            name: ssh.service
          register: estacao_ssh

        - name: Verify SSH service is running
          ansible.builtin.assert:
            that: "estacao_ssh.status.ActiveState == 'active'"
            fail_msg: "SSH service is not running"
            success_msg: "SSH service is running"

    # Categoria: CUPS (250-configura-cups.yml)
    - name: "Test 057: Verify CUPS is installed and running"
      block:
        - name: Check CUPS service status
          ansible.builtin.systemd:
            name: cups.service
          register: estacao_cups

        - name: Verify CUPS service is running
          ansible.builtin.assert:
            that: "estacao_cups.status.ActiveState == 'active'"
            fail_msg: "CUPS service is not running"
            success_msg: "CUPS service is running"

    # Categoria: On Login (280-on-login.yml)
    - name: "Test 066: Verify on-login script exists"
      block:
        - name: Check on-login script
          ansible.builtin.stat:
            path: /usr/local/cmc/scripts/on-login.sh
          register: estacao_login

        - name: Verify on-login script exists
          ansible.builtin.assert:
            that: "estacao_login.stat.exists and estacao_login.stat.executable"
            fail_msg: "On-login script does not exist or is not executable"
            success_msg: "On-login script exists and is executable"

    # Categoria: Versionamento (990-versionamento.yml)
    - name: "Test 072: Verify version file exists"
      block:
        - name: Check version file
          ansible.builtin.stat:
            path: /usr/local/cmc/version
          register: estacao_version

        - name: Verify version file exists
          ansible.builtin.assert:
            that: "estacao_version.stat.exists"
            fail_msg: "Version file does not exist"
            success_msg: "Version file exists"

    # Categoria: Arquivos Modificados (999-arquivos-modificados.yml)
    - name: "Test 073: Verify modified files directory exists"
      block:
        - name: Check modified files directory
          ansible.builtin.stat:
            path: /usr/local/cmc/modificados
          register: estacao_modified

        - name: Verify modified files directory exists
          ansible.builtin.assert:
            that: "estacao_modified.stat.exists and estacao_modified.stat.isdir"
            fail_msg: "Modified files directory does not exist"
            success_msg: "Modified files directory exists"

    # Final verification message
    - name: "Verification Summary"
      ansible.builtin.debug:
        msg: |
          =================================================
          MOLECULE VERIFICATION COMPLETED
          =================================================

          Automated tests completed successfully!

          IMPORTANT: This covers only the tests that can be
          automated. Please also run the manual tests from
          caderno-de-testes.md for complete validation.

          Manual tests still needed:
          - User authentication testing
          - GUI functionality testing
          - Network connectivity testing
          - Performance testing
          - Integration testing

          =================================================
